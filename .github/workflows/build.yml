name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o IqraaIPTV.zip

      - name: Apply offline browse patch
        run: |
          base64 -d .github/offline_patch_317.b64 > /tmp/offline-patch.zip
          (cd iptv-player && unzip -o /tmp/offline-patch.zip)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          sdk_root="/usr/local/lib/android/sdk"
          test -d "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build both APKs
        working-directory: iptv-player
        run: gradle :app:assemblePrimaryDebug :app:assembleSecondaryDebug --no-daemon --stacktrace

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: IqraaIPTV-dual-3.18-apks
          path: |
            iptv-player/app/build/outputs/apk/primary/debug/app-primary-debug.apk
            iptv-player/app/build/outputs/apk/secondary/debug/app-secondary-debug.apk

  windows-build:
    name: Build Windows 10 EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows app
        run: dotnet publish windows-player/VoltixIptvWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Voltix-IPTV-Windows-10
          path: windows-player/bin/Release/net8.0-windows/win-x64/publish/VoltixIptvWindows.exe


  windows-exact-android:
    name: Package exact Android UI launcher for Windows 10
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        shell: bash
        run: unzip -o IqraaIPTV.zip
      - name: Apply offline browse patch
        shell: bash
        run: |
          base64 -d .github/offline_patch_317.b64 > /tmp/offline-patch.zip
          (cd iptv-player && unzip -o /tmp/offline-patch.zip)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android build packages
        shell: pwsh
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build original Android APK
        working-directory: iptv-player
        run: gradle :app:assemblePrimaryDebug --no-daemon --stacktrace
      - name: Assemble Windows launcher package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item windows-exact-android\Start-IqraaIPTV.ps1 package\Start-IqraaIPTV.ps1
          Copy-Item iptv-player\app\build\outputs\apk\primary\debug\app-primary-debug.apk package\IqraaIPTV.apk
          Compress-Archive -Path package\* -DestinationPath IqraaIPTV-Windows-Exact-Android.zip -Force
      - name: Upload exact Android package
        uses: actions/upload-artifact@v4
        with:
          name: IqraaIPTV-Windows-Exact-Android
          path: IqraaIPTV-Windows-Exact-Android.zip


  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish native Windows app
        run: dotnet publish windows-player/VoltixIptvWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\IqraaIPTV.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: IqraaIPTV-Windows-Setup
          path: installer\installer-output\IqraaIPTV-Windows-Setup.exe
